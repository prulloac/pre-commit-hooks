[metadata]
name = pre_commit_hooks
version = 1.0.0
description = Some pre-commit hooks.
long_description = file: README.md
long_description_content_type = text/markdown
url = https://github.com/prulloac/pre-commit-hooks
author = Pablo Ulloa
author_email = pablo.ulloac@usach.cl
license = MIT
license_files = LICENSE
classifiers =
    Programming Language :: Python :: 3
    Programming Language :: Python :: 3 :: Only
    Programming Language :: Python :: Implementation :: CPython
    Programming Language :: Python :: Implementation :: PyPy

[options]
packages = find:
install_requires =
    ruamel.yaml>=0.15
    tomli>=1.1.0;python_version<"3.11"
python_requires = >=3.10

[options.packages.find]
exclude =
    tests*
    testing*

[options.entry_points]
console_scripts =
    validate-commit-msg-conventional = validate_commit_msg_conventional:main
    validate-commit-msg-max = validate_commit_msg_max:main
    validate-commit-msg-opencode = validate_commit_msg_opencode:main
    validate-commit-msg-copilot = validate_commit_msg_copilot:main
    validate-commit-msg-gemini = validate_commit_msg_gemini:main

[bdist_wheel]
universal = True

[coverage:run]
plugins = covdefaults

[mypy]
check_untyped_defs = true
disallow_any_generics = true
disallow_incomplete_defs = true
disallow_untyped_defs = true
warn_redundant_casts = true
warn_unused_ignores = true

[mypy-testing.*]
disallow_untyped_defs = false

[mypy-tests.*]
disallow_untyped_defs = false